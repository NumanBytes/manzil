services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: manzil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manzil
    ports:
      - "5433:5432"
    volumes:
      - manzil-postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manzil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  manzil-postgres-data:
